name: Capability request
description: Ask for something safe-docx cannot do yet.
title: "<package>: cannot <what a user needs to do>"
labels:
  - kind:capability
body:
  - type: markdown
    attributes:
      value: |
        Safe Docx is a headless tool for legal document work, not a general-purpose editor. Check [docs/scope.md](https://github.com/UseJunior/safe-docx/blob/main/docs/scope.md) before filing.

        New capabilities, breaking changes and architecture shifts also need an OpenSpec change proposal.
  - type: textarea
    id: workflow
    attributes:
      label: Legal workflow
      description: What document task needs this, and what happens today without it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behaviour
      description: What the tool or API should do. Include an example input and output if you can.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checks that would show this is done, written so they can become tests.
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - docx-core
        - docx-compare
        - docx-markdoc
        - docx-mcp
        - safe-docx (CLI)
        - safe-docx-mcpb
        - docx-render-verifier
        - docx-release-verifier
        - odf-core
        - google-docs-core
        - CI / release
        - docs
        - unknown / multiple
    validations:
      required: true
  - type: checkboxes
    id: change-type
    attributes:
      label: Change type
      options:
        - label: This introduces a new capability or behaviour shift and needs an OpenSpec proposal.
        - label: This may affect ECMA-376 / OOXML conformance.
  - type: textarea
    id: conformance
    attributes:
      label: ECMA-376 / OOXML notes
      description: Optional. Targeted sections or conformance risks.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Links, fixtures or related issues. Never attach a client or confidential document.
