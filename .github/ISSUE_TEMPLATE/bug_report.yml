name: Bug report
description: Report wrong, corrupt or missing output from safe-docx.
title: "<package>: <what goes wrong, as observed>"
labels:
  - kind:defect
body:
  - type: markdown
    attributes:
      value: |
        Title the issue with the observed symptom, not the fix. For example, "docx-compare: accept-all leaves a deleted table row in place" rather than "fix(docx-compare): handle row deletions".

        Check [docs/scope.md](https://github.com/UseJunior/safe-docx/blob/main/docs/scope.md) first. **Never attach a client or confidential document.** Reduce the problem to synthetic OOXML or a public fixture.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What goes wrong, and what harm does it cause to someone relying on the output?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest synthetic OOXML, fixture path, or code sample that shows the problem, plus the command or tool call you ran.
      render: xml
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or package version
      placeholder: "main @ abc1234, or @usejunior/safe-docx 0.12.0"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Include the error, the relevant output XML, or what Word/LibreOffice shows.
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: Suspected cause
      description: Optional. The file and function you believe is responsible, if known.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Optional. Checks that would show this is fixed, written so they can become tests.
      placeholder: |
        - [ ] accept-all output equals the revised document
        - [ ] the output opens in Word without a repair prompt
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - docx-core
        - docx-compare
        - docx-markdoc
        - docx-mcp
        - safe-docx (CLI)
        - safe-docx-mcpb
        - docx-render-verifier
        - docx-release-verifier
        - odf-core
        - google-docs-core
        - CI / release
        - unknown / multiple
    validations:
      required: true
  - type: textarea
    id: conformance
    attributes:
      label: ECMA-376 / OOXML reference
      description: Optional. The relevant ECMA-376 section, if known.
      placeholder: "ECMA-376 5th edition, Part 1, §17.13.5"
  - type: checkboxes
    id: confidentiality
    attributes:
      label: Confidentiality
      options:
        - label: This issue contains no client or confidential document content.
          required: true
