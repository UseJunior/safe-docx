name: Lean Build

on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'verification/lean/**'
      - 'verification/registry/**'
      - 'scripts/normalize_lean_axioms.mjs'
      - '.github/workflows/lean-build.yml'
      - 'packages/docx-core/src/integration/lean-differential-lcs.test.ts'
      # The differential gate guards the production TS LCS against the Lean model,
      # so a change to either must re-run it — not just changes to the harness.
      - 'packages/docx-core/src/baselines/atomizer/atomLcs.ts'
      - 'packages/docx-core/src/core-types.ts'
      # Tier 2-helper differential: guards the production accept/reject/validate engine
      # against the Lean Tier 2 model, so a change to either re-runs it.
      - 'packages/docx-core/src/integration/lean-differential-helpers.test.ts'
      - 'packages/docx-core/src/baselines/atomizer/trackChangesAcceptorAst.ts'
      - 'packages/docx-core/src/baselines/atomizer/pipeline.ts'
  pull_request:
    branches: [main]
    paths:
      - 'verification/lean/**'
      - 'verification/registry/**'
      - 'scripts/normalize_lean_axioms.mjs'
      - '.github/workflows/lean-build.yml'
      - 'packages/docx-core/src/integration/lean-differential-lcs.test.ts'
      - 'packages/docx-core/src/baselines/atomizer/atomLcs.ts'
      - 'packages/docx-core/src/core-types.ts'
      - 'packages/docx-core/src/integration/lean-differential-helpers.test.ts'
      - 'packages/docx-core/src/baselines/atomizer/trackChangesAcceptorAst.ts'
      - 'packages/docx-core/src/baselines/atomizer/pipeline.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      # No `restore-keys` fallback: a partial match on `.lake` / `~/.elan`
      # across toolchain or manifest changes can silently restore artifacts
      # compiled against the wrong Lean/mathlib version. Better to take a
      # cold-cache hit (and depend on `lake exe cache get` below) than to
      # poison the build with stale oleans on key changes.
      - name: Cache elan toolchain and lake build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.elan
            verification/lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lake-manifest.json') }}

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            for attempt in 1 2 3; do
              echo "elan install attempt ${attempt}/3"
              if curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh && \
                sh elan-init.sh -y --default-toolchain none; then
                rm -f elan-init.sh
                break
              fi
              rm -f elan-init.sh
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 20))
              else
                echo "elan install failed after 3 attempts"
                exit 1
              fi
            done
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # `lake exe cache get` downloads mathlib pre-built .olean files from
      # the leanprover-community CDN. Cold-from-source compilation of
      # mathlib takes ~30 minutes — i.e. it would consume the entire job
      # timeout below — so we treat CDN unreachability as a job failure
      # rather than silently falling back to a multi-hour source compile.
      # The committed lake-manifest.json is the source of truth; we
      # deliberately do NOT run `lake update` here (it would mutate the
      # manifest and the cache key would no longer match).
      - name: Fetch mathlib pre-built oleans
        working-directory: verification/lean
        run: |
          for attempt in 1 2 3; do
            echo "lake exe cache get attempt ${attempt}/3"
            if lake exe cache get; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "lake exe cache get failed after 3 attempts; aborting rather than attempting a ~30min source compile under a 30min job timeout"
          exit 1

      - name: Build LeanSpike
        working-directory: verification/lean
        run: lake build

      - name: Audit Lean axiom allowlist
        working-directory: verification/lean
        run: |
          lake env lean AxiomAudit.lean > /tmp/axiom-audit-raw.txt
          node ../../scripts/normalize_lean_axioms.mjs /tmp/axiom-audit-raw.txt > /tmp/axiom-audit-observed.txt
          sort -u expected-axioms.txt > /tmp/axiom-audit-expected.txt
          echo "Observed axiom union:"
          cat /tmp/axiom-audit-observed.txt
          if ! diff -u /tmp/axiom-audit-expected.txt /tmp/axiom-audit-observed.txt; then
            echo "ERROR: Lean axiom allowlist drift detected."
            echo "Unexpected observed axioms:"
            comm -13 /tmp/axiom-audit-expected.txt /tmp/axiom-audit-observed.txt || true
            echo "Allowlisted axioms no longer observed:"
            comm -23 /tmp/axiom-audit-expected.txt /tmp/axiom-audit-observed.txt || true
            exit 1
          fi

      # Audit uses grep (POSIX-guaranteed on ubuntu-latest) rather than ripgrep
      # — rg is NOT pre-installed on the default runner image. `-w` matches the
      # whole word `sorry` so prose containing the substring (e.g. an English
      # apology in a future docstring) doesn't trip the audit.
      - name: Audit all Lean modules are zero-sorry
        working-directory: verification/lean
        run: |
          # The entire spike is zero-sorry as of the `inv_rt_001` closure
          # (`add-inv-rt-001-proof`): `inv_field_001` was closed in Tier 2 and
          # `inv_rt_001` is now closed too. Both invariants carry a single named
          # residual axiom each (`compareDocumentXml_output_preservation_friendly`,
          # `compareDocumentXml_output_text_roundtrip`), which are `axiom`s, not
          # `sorry`s — Tier 3 discharges them.
          # `find -print0 | xargs -0 grep` avoids the SC2086 word-splitting
          # foot-gun. Scans every `.lean` under verification/lean (modules,
          # `lakefile.lean`, and any future files) EXCEPT the `.lake` build/deps
          # tree, so the audit is genuinely repo-wide rather than tied to the
          # current module layout.
          if find . -name '*.lean' -not -path './.lake/*' -print0 \
               | xargs -0 grep -nwH "sorry"; then
            echo "ERROR: sorry found in Lean modules. The spike must remain zero-sorry."
            exit 1
          fi

      # Lean↔TS LCS differential harness (Tier 2.5). `lake build` above already built
      # the `leanDifferential` exe (a @[default_target] lean_exe). This step runs it
      # against the production TS `computeAtomLcs` and asserts identical output over
      # the exhaustive length-≤6 / 3-symbol sweep. Needs Node; runs at repo root.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Lean↔TS LCS differential harness (exhaustive)
        env:
          LEAN_DIFF_EXHAUSTIVE: '1'
        run: npm run test:run -w @usejunior/docx-core -- src/integration/lean-differential-lcs.test.ts

      # Lean↔TS Tier 2-helper differential harness (Tier 2.5, second increment). `lake build`
      # above also built the `leanHelperDifferential` exe (a @[default_target] lean_exe). This
      # step runs the genuine `Tier2.AcceptReject.accept`/`.reject` and
      # `Tier2.FieldStructure.validateFieldStructure` against the production
      # accept/reject/validate engine over a widened randomized sweep, reusing the Node setup
      # and `npm ci` above. `LEAN_DIFF_EXHAUSTIVE=1` widens this harness's random sweep too.
      - name: Lean↔TS Tier 2-helper differential harness (extended)
        env:
          LEAN_DIFF_EXHAUSTIVE: '1'
        run: npm run test:run -w @usejunior/docx-core -- src/integration/lean-differential-helpers.test.ts
