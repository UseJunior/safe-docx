name: Lean Build

on:
  push:
    branches: [main]
    paths:
      - 'verification/lean/**'
      - '.github/workflows/lean-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/lean/**'
      - '.github/workflows/lean-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Cache elan toolchain and lake build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.elan
            verification/lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lake-manifest.json') }}
          restore-keys: |
            lean-${{ runner.os }}-

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            for attempt in 1 2 3; do
              echo "elan install attempt ${attempt}/3"
              if curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh && \
                sh elan-init.sh -y --default-toolchain none; then
                rm -f elan-init.sh
                break
              fi
              rm -f elan-init.sh
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 20))
              else
                echo "elan install failed after 3 attempts"
                exit 1
              fi
            done
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Best-effort optimization. The committed lake-manifest.json is the
      # source of truth, so we deliberately do NOT run `lake update` here:
      # it would mutate lake-manifest.json and (without --keep-toolchain)
      # potentially lean-toolchain too, both of which feed the cache key
      # above. A mutated manifest after the key was evaluated would poison
      # subsequent cache restores. `lake build` below resolves and fetches
      # any packages the committed manifest declares.
      #
      # `lake exe cache get` downloads mathlib pre-built .olean files from
      # the leanprover-community CDN (cold mathlib compile is ~30 min from
      # source; with cache get it's ~30 s). If the CDN is unreachable we
      # still want the build to attempt and succeed via compilation, so
      # this step is marked continue-on-error.
      - name: Fetch mathlib pre-built oleans (best-effort)
        working-directory: verification/lean
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "lake exe cache get attempt ${attempt}/3"
            if lake exe cache get; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "lake exe cache get failed after 3 attempts; lake build will compile from source"
          exit 1

      - name: Build LeanSpike
        working-directory: verification/lean
        run: lake build

      # Audits use grep (POSIX-guaranteed on ubuntu-latest) rather than ripgrep
      # — rg is NOT pre-installed on the default runner image, and the prior
      # `if rg ...` form silently passed when rg was missing (exit 127 made
      # the `if` branch false, causing a false-negative audit).
      - name: Audit Stage 1-3 modules are zero-sorry
        working-directory: verification/lean
        run: |
          if grep -n "sorry" LeanSpike/AtomsEqual.lean LeanSpike/Lcs.lean; then
            echo "ERROR: sorry found in Stage 1-3 proof modules. They must remain zero-sorry."
            exit 1
          fi

      - name: Audit Spec.lean has exactly 2 sorries
        working-directory: verification/lean
        run: |
          count=$(grep -c "sorry" LeanSpike/Spec.lean || true)
          if [ "$count" != "2" ]; then
            echo "ERROR: Spec.lean expected exactly 2 sorries, found $count."
            grep -n "sorry" LeanSpike/Spec.lean || true
            exit 1
          fi
