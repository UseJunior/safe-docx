name: Lean Build

on:
  push:
    branches: [main]
    paths:
      - 'verification/lean/**'
      - '.github/workflows/lean-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'verification/lean/**'
      - '.github/workflows/lean-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Cache elan toolchain and lake build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.elan
            verification/lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lake-manifest.json') }}
          restore-keys: |
            lean-${{ runner.os }}-

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            for attempt in 1 2 3; do
              echo "elan install attempt ${attempt}/3"
              if curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh && \
                sh elan-init.sh -y --default-toolchain none; then
                rm -f elan-init.sh
                break
              fi
              rm -f elan-init.sh
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 20))
              else
                echo "elan install failed after 3 attempts"
                exit 1
              fi
            done
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch mathlib pre-built oleans
        working-directory: verification/lean
        run: |
          for attempt in 1 2 3; do
            echo "lake update + cache get attempt ${attempt}/3"
            if lake update && lake exe cache get; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "lake update / lake exe cache get failed after 3 attempts"
          exit 1

      - name: Build LeanSpike
        working-directory: verification/lean
        run: lake build

      - name: Audit Stage 1-3 modules are zero-sorry
        working-directory: verification/lean
        run: |
          if rg -n "sorry" LeanSpike/AtomsEqual.lean LeanSpike/Lcs.lean; then
            echo "ERROR: sorry found in Stage 1-3 proof modules. They must remain zero-sorry."
            exit 1
          fi

      - name: Audit Spec.lean has exactly 2 sorries
        working-directory: verification/lean
        run: |
          count=$(rg -c "sorry" LeanSpike/Spec.lean || echo 0)
          if [ "$count" != "2" ]; then
            echo "ERROR: Spec.lean expected exactly 2 sorries, found $count."
            rg -n "sorry" LeanSpike/Spec.lean
            exit 1
          fi
