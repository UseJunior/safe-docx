name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run for its previous head SHA, so cancel
# that run instead of paying for it to finish. Pushes to main and manual
# dispatches each get a unique group (the run id) and are never cancelled or
# dropped from the queue: every main commit keeps its own full CI record.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the heavy jobs (build, lint, tests, real-corpus, CodeQL,
  # MCPB bundle) need to run. Required checks gate on this in-job, step by
  # step, so they still report success on docs-only PRs; a workflow-level
  # `paths:` filter would leave them pending forever and block merge.
  #
  # Docs-only means every changed path (including a rename's old path) is a
  # Markdown file at the repo root or under docs/, .claude/, .cursor/ or
  # memory/, except GEMINI.md (the Gemini extension context file, whose
  # contents a docx-mcp test asserts). Markdown elsewhere is NOT docs-only:
  # tests read openspec/**, packages/**/docs/** and other in-tree .md files.
  # Pushes to main, manual dispatches, and any classification error always
  # run everything.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - name: Classify PR changes as docs-only or code
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DOCS_ONLY_RE: '^([^/]+|(docs|\.claude|\.cursor|memory)/.+)\.md$'
          # Markdown matched above that tests or builds read anyway.
          CODE_MD_RE: '^GEMINI\.md$'
        run: |
          set -uo pipefail
          heavy=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                --jq '.[] | .filename, (.previous_filename // empty)'); then
              total=$(printf '%s\n' "$files" | grep -c . || true)
              non_docs=$(printf '%s\n' "$files" | awk '
                NF && ($0 !~ ENVIRON["DOCS_ONLY_RE"] || $0 ~ ENVIRON["CODE_MD_RE"]) { n++ }
                END { print n + 0 }')
              echo "Changed paths: ${total}; non-docs paths: ${non_docs}"
              # The PR files API stops at 3000 entries; treat a full page as unknown.
              if [ "$total" -gt 0 ] && [ "$total" -lt 3000 ] && [ "$non_docs" -eq 0 ]; then
                heavy=false
              fi
            else
              echo "::warning::Could not list PR files; running the full CI."
            fi
          fi
          echo "heavy=${heavy}" >> "$GITHUB_OUTPUT"
          if [ "$heavy" = "false" ]; then
            echo "::notice::Docs-only change: build, lint, test, real-corpus, CodeQL and MCPB jobs report success without running."
          fi

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  gemini-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate Gemini extension manifest
        run: node scripts/check_gemini_extension_manifest.mjs

  readme-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify README translations are in sync with English source
        run: node scripts/sync_readme_blocks.mjs --check

  workspace-lint:
    runs-on: ubuntu-latest
    needs: changes
    env:
      CI_RUN_HEAVY: ${{ needs.changes.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CI_RUN_HEAVY == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.CI_RUN_HEAVY == 'true'
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        if: env.CI_RUN_HEAVY == 'true'
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Build workspaces
        if: env.CI_RUN_HEAVY == 'true'
        run: npm run build
      - name: Lint/typecheck workspaces
        if: env.CI_RUN_HEAVY == 'true'
        run: npm run lint:workspaces
      - name: Check for import cycles
        if: env.CI_RUN_HEAVY == 'true'
        run: npm run check:cycles
      - name: Check for raw control bytes in source
        if: env.CI_RUN_HEAVY == 'true'
        run: npm run check:control-bytes
      - name: Check release isolation (ODF decoupling guard)
        if: env.CI_RUN_HEAVY == 'true'
        run: npm run check:release-isolation
      - name: Test release-isolation guard
        if: env.CI_RUN_HEAVY == 'true'
        run: npm run test:release-isolation
      - name: Test formatting-loss detectors (unit tests + known-bad self-test)
        if: env.CI_RUN_HEAVY == 'true'
        run: npm run test:docx-formatting-loss
      - name: Test real-corpus gate wrapper (mirrors the real-corpus-comparison job)
        if: env.CI_RUN_HEAVY == 'true'
        run: npm run test:check-real-corpus

  spec-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Capability evidence is verified against historical local commits.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Validate OpenSpec traceability coverage
        run: npm run check:spec-coverage
      - name: Verify ECMA-376 source artifacts and generated coverage
        run: npm run check:ecma-376-coverage
      - name: Verify SafeDocX capability evidence projection
        run: npm run check:capability-projection

  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Install site dependencies
        run: npm --prefix site ci
      - name: Build site and validate internal links
        run: npm run check:site

  tool-docs-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Regenerate and verify tool reference docs are committed
        run: npm run check:tool-docs

  mcpb-manifest-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Validate MCPB manifest/tool contract
        run: npm run check:mcpb-manifest

  allure-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Validate Allure hierarchy labels
        run: npm run check:allure-labels
      - name: Enforce Allure filename migration policy
        run: npm run check:allure-filenames

  allure-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Validate Allure quality conventions
        run: npm run check:allure-quality

  codeql:
    runs-on: ubuntu-latest
    needs: changes
    # Not a required check, so a plain job-level skip is safe here.
    if: needs.changes.outputs.heavy == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Build workspaces
        run: npm run build
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  semgrep:
    uses: ./.github/workflows/semgrep.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  workspace-test:
    runs-on: ubuntu-latest
    needs: [changes, workspace-lint]
    permissions:
      contents: read
      id-token: write
    # Both matrix legs always start so the required `workspace-test (20)` and
    # `workspace-test (22)` checks always report. On PRs only the Node 20 leg
    # does work: it tests every workspace (the coverage set plus a step for
    # all the others), then runs the ratchet and emitted-schema gate. The
    # Node 22 leg's steps are skipped and it passes in seconds. Pushes to main
    # and manual dispatches run both legs in full. To get Node 22 results on
    # a PR branch before merge, run `gh workflow run ci.yml --ref <branch>`.
    env:
      CI_RUN_HEAVY: ${{ needs.changes.outputs.heavy == 'true' && (matrix.coverage || github.event_name != 'pull_request') }}
    strategy:
      matrix:
        node-version: [20, 22]
        include:
          - node-version: 20
            coverage: true
          - node-version: 22
            coverage: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CI_RUN_HEAVY == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.CI_RUN_HEAVY == 'true'
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Schema-backed workspace tests invoke the same vendored-XSD validator as
      # the emitted-document gate below, so xmllint must exist before tests run.
      - name: Install XML schema validator
        if: env.CI_RUN_HEAVY == 'true'
        run: |
          if ! command -v xmllint >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libxml2-utils
          fi
      - name: Install dependencies (npm ci with retry)
        if: env.CI_RUN_HEAVY == 'true'
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Build workspaces
        if: env.CI_RUN_HEAVY == 'true'
        run: npm run build
      - name: Isolated package runtime smoke test
        if: ${{ env.CI_RUN_HEAVY == 'true' && matrix.coverage }}
        run: |
          pack_dir="$(mktemp -d)"
          run_dir="$(mktemp -d)"
          core_tgz="$(cd packages/docx-core && npm pack --silent --pack-destination "$pack_dir")"
          compare_tgz="$(cd packages/docx-compare && npm pack --silent --pack-destination "$pack_dir")"
          odf_tgz="$(cd packages/odf-core && npm pack --silent --pack-destination "$pack_dir")"
          mcp_tgz="$(cd packages/docx-mcp && npm pack --silent --pack-destination "$pack_dir")"
          safe_tgz="$(cd packages/safe-docx && npm pack --silent --pack-destination "$pack_dir")"
          pushd "$run_dir"
          npm init -y >/dev/null
          for attempt in 1 2 3; do
            echo "runtime smoke attempt ${attempt}/3"
            rm -rf node_modules package-lock.json
            if npm install --no-audit --no-fund "$pack_dir/$core_tgz" "$pack_dir/$compare_tgz" "$pack_dir/$odf_tgz" "$pack_dir/$mcp_tgz" "$pack_dir/$safe_tgz" >/dev/null \
              && ./node_modules/.bin/safe-docx --help; then
              popd
              rm -rf "$pack_dir" "$run_dir"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          popd
          rm -rf "$pack_dir" "$run_dir"
          echo "runtime smoke failed after 3 attempts"
          exit 1
      - name: Test workspaces (with coverage)
        if: ${{ env.CI_RUN_HEAVY == 'true' && matrix.coverage }}
        env:
          SDX_SCHEMA_CORPUS_DIR: ${{ runner.temp }}/schema-corpus
        run: |
          npm run test:coverage -w @usejunior/docx-core
          npm run test:coverage -w @usejunior/docx-compare
          npm run test:coverage -w @usejunior/docx-markdoc
          npm run test:coverage -w @usejunior/docx-mcp
          npm run test:run -w @usejunior/safe-docx
          npm run test:run -w @usejunior/safedocx-mcpb
      # The coverage step above names six workspaces. On PRs the Node 22 leg
      # (which runs `npm run test` across all of them) is skipped, so test the
      # rest here. Discovered from packages/* so a new workspace is never
      # silently left out of pre-merge testing.
      - name: Test remaining workspaces
        if: ${{ env.CI_RUN_HEAVY == 'true' && matrix.coverage }}
        env:
          SDX_SCHEMA_CORPUS_DIR: ${{ runner.temp }}/schema-corpus
        run: |
          covered=" @usejunior/docx-core @usejunior/docx-compare @usejunior/docx-markdoc @usejunior/docx-mcp @usejunior/safe-docx @usejunior/safedocx-mcpb "
          for manifest in packages/*/package.json; do
            name=$(node -p "require('./${manifest}').name")
            case "$covered" in *" ${name} "*) continue ;; esac
            echo "::group::test:run ${name}"
            npm run test:run --if-present -w "$name"
            echo "::endgroup::"
          done
      - name: Test workspaces
        if: ${{ env.CI_RUN_HEAVY == 'true' && !matrix.coverage }}
        env:
          SDX_SCHEMA_CORPUS_DIR: ${{ runner.temp }}/schema-corpus
        run: npm run test
      - name: Validate emitted document.xml corpus against ECMA-376 schema
        if: env.CI_RUN_HEAVY == 'true'
        run: |
          node scripts/check_emitted_document_schema.mjs --self-test \
            --known-failures coverage/emitted-schema-known-failures.json \
            "$RUNNER_TEMP/schema-corpus"
      - name: Generate package coverage dashboard + enforce ratchet
        if: ${{ env.CI_RUN_HEAVY == 'true' && matrix.coverage }}
        run: |
          mkdir -p coverage
          npm run coverage:packages:check > coverage/package-coverage-table.txt
          cat coverage/package-coverage-table.txt
      - name: Upload package coverage artifacts
        if: ${{ always() && env.CI_RUN_HEAVY == 'true' && matrix.coverage }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-coverage
          if-no-files-found: error
          path: |
            coverage/package-coverage-baseline.json
            coverage/package-coverage-summary.json
            coverage/package-coverage-table.txt
            packages/docx-core/coverage/coverage-summary.json
            packages/docx-compare/coverage/coverage-summary.json
            packages/docx-markdoc/coverage/coverage-summary.json
            packages/docx-mcp/coverage/coverage-summary.json
            packages/docx-core/coverage/lcov.info
            packages/docx-compare/coverage/lcov.info
            packages/docx-markdoc/coverage/lcov.info
            packages/docx-mcp/coverage/lcov.info
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.CI_RUN_HEAVY == 'true' && matrix.coverage }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./packages/docx-core/coverage/lcov.info,./packages/docx-compare/coverage/lcov.info,./packages/docx-markdoc/coverage/lcov.info,./packages/docx-mcp/coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
          verbose: true
      - name: Upload allure results
        if: ${{ env.CI_RUN_HEAVY == 'true' && matrix.coverage }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results
          if-no-files-found: error
          path: |
            packages/docx-core/allure-results/
            packages/docx-mcp/allure-results/

  real-corpus-comparison:
    name: Real-corpus comparison gates
    runs-on: ubuntu-latest
    needs: [changes, workspace-lint]
    permissions:
      contents: read
    env:
      CI_RUN_HEAVY: ${{ needs.changes.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CI_RUN_HEAVY == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.CI_RUN_HEAVY == 'true'
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        if: env.CI_RUN_HEAVY == 'true'
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Materialize SHA-256-verified comparison corpus
        if: env.CI_RUN_HEAVY == 'true'
        env:
          SAFE_DOCX_REAL_CORPUS_DIR: ${{ runner.temp }}/open-agreements-cache
        run: node scripts/prepare_real_comparison_corpus.mjs "$SAFE_DOCX_REAL_CORPUS_DIR"
      - name: Run real-corpus comparison gates
        if: env.CI_RUN_HEAVY == 'true'
        env:
          SAFE_DOCX_REAL_CORPUS_DIR: ${{ runner.temp }}/open-agreements-cache
          SAFE_DOCX_REAL_CORPUS_REQUIRED: "1"
          SAFE_DOCX_STRATEGY_DIFFERENTIAL_REQUIRED: "1"
        run: npm run test:real-corpus -w @usejunior/docx-compare

  mcpb-bundle:
    runs-on: ubuntu-latest
    needs: [changes, workspace-test]
    # Not a required check, so a plain job-level skip is safe here.
    if: needs.changes.outputs.heavy == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Sanitize npm auth for public npx fetches
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true
      - name: Build and pack safe-docx MCP bundle
        run: npm run pack:mcpb
      - name: Upload MCPB bundle artifact (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safe-docx-mcpb
          if-no-files-found: error
          path: packages/safe-docx-mcpb/safe-docx.mcpb

  deploy-allure:
    if: github.ref == 'refs/heads/main'
    needs: workspace-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Download allure results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: allure-results
          path: packages
      - name: Generate Allure report
        run: npm run allure:generate
      - name: Brand Allure report
        run: npm run allure:brand
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: allure-report-repo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
