name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  gemini-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Validate Gemini extension manifest
        run: node scripts/check_gemini_extension_manifest.mjs

  readme-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Verify README translations are in sync with English source
        run: node scripts/sync_readme_blocks.mjs --check

  workspace-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Build workspaces
        run: npm run build
      - name: Lint/typecheck workspaces
        run: npm run lint:workspaces
      - name: Check for import cycles
        run: npm run check:cycles
      - name: Check for raw control bytes in source
        run: npm run check:control-bytes
      - name: Check release isolation (ODF decoupling guard)
        run: npm run check:release-isolation
      - name: Test release-isolation guard
        run: npm run test:release-isolation
      - name: Test formatting-loss detectors (unit tests + known-bad self-test)
        run: npm run test:docx-formatting-loss

  spec-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Capability evidence is verified against historical local commits.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Validate OpenSpec traceability coverage
        run: npm run check:spec-coverage
      - name: Verify ECMA-376 source artifacts and generated coverage
        run: npm run check:ecma-376-coverage
      - name: Verify SafeDocX capability evidence projection
        run: npm run check:capability-projection

  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Install site dependencies
        run: npm --prefix site ci
      - name: Build site and validate internal links
        run: npm run check:site

  tool-docs-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Regenerate and verify tool reference docs are committed
        run: npm run check:tool-docs

  mcpb-manifest-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Validate MCPB manifest/tool contract
        run: npm run check:mcpb-manifest

  allure-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Validate Allure hierarchy labels
        run: npm run check:allure-labels
      - name: Enforce Allure filename migration policy
        run: npm run check:allure-filenames

  allure-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Validate Allure quality conventions
        run: npm run check:allure-quality

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Build workspaces
        run: npm run build
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3

  semgrep:
    uses: ./.github/workflows/semgrep.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  workspace-test:
    runs-on: ubuntu-latest
    needs: workspace-lint
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        node-version: [20, 22]
        include:
          - node-version: 20
            coverage: true
          - node-version: 22
            coverage: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Schema-backed workspace tests invoke the same vendored-XSD validator as
      # the emitted-document gate below, so xmllint must exist before tests run.
      - name: Install XML schema validator
        run: |
          if ! command -v xmllint >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libxml2-utils
          fi
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Build workspaces
        run: npm run build
      - name: Isolated package runtime smoke test
        if: matrix.coverage
        run: |
          pack_dir="$(mktemp -d)"
          run_dir="$(mktemp -d)"
          core_tgz="$(cd packages/docx-core && npm pack --silent --pack-destination "$pack_dir")"
          compare_tgz="$(cd packages/docx-compare && npm pack --silent --pack-destination "$pack_dir")"
          odf_tgz="$(cd packages/odf-core && npm pack --silent --pack-destination "$pack_dir")"
          mcp_tgz="$(cd packages/docx-mcp && npm pack --silent --pack-destination "$pack_dir")"
          safe_tgz="$(cd packages/safe-docx && npm pack --silent --pack-destination "$pack_dir")"
          pushd "$run_dir"
          npm init -y >/dev/null
          for attempt in 1 2 3; do
            echo "runtime smoke attempt ${attempt}/3"
            rm -rf node_modules package-lock.json
            if npm install --no-audit --no-fund "$pack_dir/$core_tgz" "$pack_dir/$compare_tgz" "$pack_dir/$odf_tgz" "$pack_dir/$mcp_tgz" "$pack_dir/$safe_tgz" >/dev/null \
              && ./node_modules/.bin/safe-docx --help; then
              popd
              rm -rf "$pack_dir" "$run_dir"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          popd
          rm -rf "$pack_dir" "$run_dir"
          echo "runtime smoke failed after 3 attempts"
          exit 1
      - name: Test workspaces (with coverage)
        if: matrix.coverage
        env:
          SDX_SCHEMA_CORPUS_DIR: ${{ runner.temp }}/schema-corpus
        run: |
          npm run test:coverage -w @usejunior/docx-core
          npm run test:coverage -w @usejunior/docx-compare
          npm run test:coverage -w @usejunior/docx-mcp
          npm run test:run -w @usejunior/safe-docx
          npm run test:run -w @usejunior/safedocx-mcpb
      - name: Test workspaces
        if: ${{ !matrix.coverage }}
        env:
          SDX_SCHEMA_CORPUS_DIR: ${{ runner.temp }}/schema-corpus
        run: npm run test
      - name: Validate emitted document.xml corpus against ECMA-376 schema
        run: |
          node scripts/check_emitted_document_schema.mjs --self-test \
            --known-failures coverage/emitted-schema-known-failures.json \
            "$RUNNER_TEMP/schema-corpus"
      - name: Generate package coverage dashboard + enforce ratchet
        if: matrix.coverage
        run: |
          mkdir -p coverage
          npm run coverage:packages:check > coverage/package-coverage-table.txt
          cat coverage/package-coverage-table.txt
      - name: Upload package coverage artifacts
        if: ${{ matrix.coverage && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-coverage
          if-no-files-found: error
          path: |
            coverage/package-coverage-baseline.json
            coverage/package-coverage-summary.json
            coverage/package-coverage-table.txt
            packages/docx-core/coverage/coverage-summary.json
            packages/docx-compare/coverage/coverage-summary.json
            packages/docx-mcp/coverage/coverage-summary.json
            packages/docx-core/coverage/lcov.info
            packages/docx-compare/coverage/lcov.info
            packages/docx-mcp/coverage/lcov.info
      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage && !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./packages/docx-core/coverage/lcov.info,./packages/docx-compare/coverage/lcov.info,./packages/docx-mcp/coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
          verbose: true
      - name: Upload allure results
        if: matrix.coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-results
          if-no-files-found: error
          path: |
            packages/docx-core/allure-results/
            packages/docx-mcp/allure-results/

  real-corpus-comparison:
    name: Real-corpus comparison gates
    runs-on: ubuntu-latest
    needs: workspace-lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Materialize SHA-256-verified comparison corpus
        env:
          SAFE_DOCX_REAL_CORPUS_DIR: ${{ runner.temp }}/open-agreements-cache
        run: node scripts/prepare_real_comparison_corpus.mjs "$SAFE_DOCX_REAL_CORPUS_DIR"
      - name: Run real-corpus comparison gates
        env:
          SAFE_DOCX_REAL_CORPUS_DIR: ${{ runner.temp }}/open-agreements-cache
          SAFE_DOCX_REAL_CORPUS_REQUIRED: "1"
          SAFE_DOCX_STRATEGY_DIFFERENTIAL_REQUIRED: "1"
        run: npm run test:real-corpus -w @usejunior/docx-compare

  mcpb-bundle:
    runs-on: ubuntu-latest
    needs: workspace-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Sanitize npm auth for public npx fetches
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true
      - name: Build and pack safe-docx MCP bundle
        run: npm run pack:mcpb
      - name: Upload MCPB bundle artifact (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safe-docx-mcpb
          if-no-files-found: error
          path: packages/safe-docx-mcpb/safe-docx.mcpb

  deploy-allure:
    if: github.ref == 'refs/heads/main'
    needs: workspace-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - name: Download allure results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: allure-results
          path: packages
      - name: Generate Allure report
        run: npm run allure:generate
      - name: Brand Allure report
        run: npm run allure:brand
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: allure-report-repo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
