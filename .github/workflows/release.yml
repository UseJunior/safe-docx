name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (for example: v0.1.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    concurrency:
      group: npm-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 11.5.1+ for OIDC trusted publishing compatibility
        run: npm install --global npm@11.5.1

      - name: Verify tag matches package suite versions
        run: |
          TAG_REF="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_REF#v}"
          for pkg in packages/docx-core packages/docx-compare packages/odf-core packages/docx-mcp packages/google-docs-core packages/safe-docx packages/safe-docx-mcpb; do
            PKG_VERSION="$(node -p "require('./${pkg}/package.json').version")"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "Tag version ($TAG_VERSION) must match ${pkg}/package.json version ($PKG_VERSION)."
              exit 1
            fi
          done
          MANIFEST_VERSION="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('./packages/safe-docx-mcpb/manifest.json','utf8'));process.stdout.write(m.version)")"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) must match packages/safe-docx-mcpb/manifest.json version ($MANIFEST_VERSION)."
            exit 1
          fi
          SERVER_VERSION="$(node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('./packages/safe-docx/server.json','utf8'));process.stdout.write(s.version)")"
          if [ "$TAG_VERSION" != "$SERVER_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) must match packages/safe-docx/server.json version ($SERVER_VERSION)."
            exit 1
          fi
          SMITHERY_VERSION="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('./packages/safe-docx/.smithery/shttp/manifest.json','utf8'));process.stdout.write(m.payload.serverCard.serverInfo.version)")"
          if [ "$TAG_VERSION" != "$SMITHERY_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) must match packages/safe-docx/.smithery/shttp/manifest.json version ($SMITHERY_VERSION)."
            exit 1
          fi

          GEMINI_VERSION="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('./gemini-extension.json','utf8'));process.stdout.write(m.version)")"
          if [ "$TAG_VERSION" != "$GEMINI_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) must match gemini-extension.json version ($GEMINI_VERSION)."
            exit 1
          fi

      - name: Verify release commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Release tag commit is not contained in origin/main."
            exit 1
          fi

      - name: Validate Gemini extension manifest
        run: node scripts/check_gemini_extension_manifest.mjs

      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Build workspaces
        run: npm run build

      - name: Lint/typecheck workspaces
        run: npm run lint:workspaces

      - name: Regenerate and verify tool reference docs are committed
        run: npm run check:tool-docs

      - name: Install site dependencies
        run: npm --prefix site ci

      - name: Build site and validate internal links
        run: npm run check:site

      - name: Validate MCPB manifest/tool contract
        run: npm run check:mcpb-manifest

      - name: Guard against duplicate publish
        run: |
          # A partially-published tag must stay recoverable. The publish step
          # aborts on the first failure, so a new package in the suite (whose
          # name does not exist on npm yet, and which OIDC trusted publishing
          # therefore cannot bootstrap) leaves the earlier packages published
          # and the rest not — see the v0.16.0 run, where docx-core landed and
          # docx-compare hit ENEEDAUTH. Failing here on *any* already-published
          # package made that state unrecoverable by re-run. Fail only when the
          # whole suite is already on npm, which is the real duplicate release.
          TAG_REF="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG_REF#v}"
          published=0
          total=0
          for pkg in @usejunior/docx-core @usejunior/docx-compare @usejunior/odf-core @usejunior/docx-mcp @usejunior/google-docs-core @usejunior/safe-docx; do
            total=$((total + 1))
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "$pkg@$VERSION already exists on npm — will be skipped."
              published=$((published + 1))
            else
              echo "$pkg@$VERSION not yet published."
            fi
          done
          if [ "$published" -eq "$total" ]; then
            echo "Every package in the suite is already published at $VERSION; nothing to release."
            exit 1
          fi
          if [ "$published" -gt 0 ]; then
            echo "::warning::Resuming a partial release: $published/$total packages already published at $VERSION."
          fi

      # Schema-backed workspace tests shell out to xmllint against the vendored
      # ECMA-376 XSDs, so it must exist before tests run. ci.yml already does
      # this ("Install XML schema validator"); release.yml did not, so those
      # tests failed here with spawnSync status null while passing in CI — a
      # preflight-only failure that blocks EVERY release. Keep the two in step.
      - name: Install XML schema validator
        run: |
          if ! command -v xmllint >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libxml2-utils
          fi

      - name: Test workspaces
        run: npm run test

      - name: Package-level smoke tests
        run: |
          npm run test:run -w @usejunior/docx-core
          npm run test:run -w @usejunior/docx-compare
          npm run test:run -w @usejunior/docx-mcp
          npm run test:run -w @usejunior/safe-docx
          npm run test:run -w @usejunior/safedocx-mcpb

      - name: Package coverage ratchet
        run: |
          npm run test:coverage:packages
          npm run coverage:packages:check

      - name: Validate OpenSpec traceability coverage
        run: npm run check:spec-coverage

      - name: Validate Allure hierarchy labels
        run: npm run check:allure-labels
      - name: Enforce Allure filename migration policy
        run: npm run check:allure-filenames
      - name: Validate Allure quality conventions
        run: npm run check:allure-quality

      - name: Verify package contents (dry-run)
        run: |
          for pkg in packages/docx-core packages/docx-compare packages/odf-core packages/docx-mcp packages/google-docs-core packages/safe-docx; do
            echo "Dry-run pack: $pkg"
            (cd "$pkg" && npm pack --dry-run)
          done

      - name: Sanitize npm auth for public npx fetches
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true

      - name: Isolated package runtime smoke test
        run: |
          pack_dir="$(mktemp -d)"
          run_dir="$(mktemp -d)"
          # Pack ALL publishable packages (same list as publish-suite): any
          # same-version workspace dep must resolve from a local tarball, not
          # the registry — at preflight time this run's versions aren't on npm
          # yet, so a registry fallback always ETARGETs (issue #395).
          tarballs=()
          for pkg in packages/docx-core packages/docx-compare packages/odf-core packages/docx-mcp packages/google-docs-core packages/safe-docx; do
            tgz="$(cd "$pkg" && npm pack --silent --pack-destination "$pack_dir")"
            tarballs+=("$pack_dir/$tgz")
          done
          pushd "$run_dir"
          npm init -y >/dev/null
          for attempt in 1 2 3; do
            echo "runtime smoke attempt ${attempt}/3"
            rm -rf node_modules package-lock.json
            if npm install --no-audit --no-fund "${tarballs[@]}" >/dev/null \
              && ./node_modules/.bin/safe-docx --help; then
              popd
              rm -rf "$pack_dir" "$run_dir"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          popd
          rm -rf "$pack_dir" "$run_dir"
          echo "runtime smoke failed after 3 attempts"
          exit 1

      - name: Build and pack safe-docx MCP bundle
        run: npm run pack:mcpb

  publish-suite:
    name: Publish package suite
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    concurrency:
      group: npm-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 11.5.1+ for OIDC trusted publishing compatibility
        run: npm install --global npm@11.5.1

      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Build publishable packages
        run: |
          npm run build -w @usejunior/docx-core
          npm run build -w @usejunior/docx-compare
          npm run build -w @usejunior/docx-mcp
          npm run build -w @usejunior/google-docs-core
          npm run build -w @usejunior/safe-docx

      - name: Publish to npm (trusted publishing)
        run: |
          TAG_REF="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG_REF#v}"
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true

          # Publish in dependency order.
          for entry in "@usejunior/docx-core:packages/docx-core" "@usejunior/docx-compare:packages/docx-compare" "@usejunior/odf-core:packages/odf-core" "@usejunior/docx-mcp:packages/docx-mcp" "@usejunior/google-docs-core:packages/google-docs-core" "@usejunior/safe-docx:packages/safe-docx"; do
            PKG_NAME="${entry%%:*}"
            PKG_DIR="${entry##*:}"
            # Skip rather than abort: a re-run of a partially-published tag must
            # be able to walk past what already landed and publish the rest.
            # Publishing is still all-or-nothing per package — npm rejects a
            # duplicate version — so skipping cannot overwrite anything.
            if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$PKG_NAME@$VERSION already exists on npm — skipping."
              continue
            fi
            echo "Publishing $PKG_NAME from $PKG_DIR"
            (cd "$PKG_DIR" && npm publish --access public --provenance)
          done

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish-suite
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Wait for npm propagation
        run: |
          TAG_REF="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG_REF#v}"
          for attempt in 1 2 3 4 5 6; do
            echo "npm propagation check attempt ${attempt}/6 (sleep $((attempt * 10))s)"
            RESULT="$(npm view "@usejunior/safe-docx@${VERSION}" version mcpName --json 2>/dev/null || true)"
            PKG_VERSION="$(echo "$RESULT" | jq -r '.version // empty' 2>/dev/null)"
            PKG_MCP="$(echo "$RESULT" | jq -r '.mcpName // empty' 2>/dev/null)"
            if [ "$PKG_VERSION" = "$VERSION" ] && [ "$PKG_MCP" = "io.github.UseJunior/safe-docx" ]; then
              echo "@usejunior/safe-docx@${VERSION} is available on npm with correct mcpName."
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "@usejunior/safe-docx@${VERSION} not found on npm after 6 attempts (~150s)."
          exit 1

      - name: Download mcp-publisher
        run: |
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)  ARCH="amd64" ;;
            aarch64) ARCH="arm64" ;;
          esac
          URL="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz"
          echo "Downloading mcp-publisher from: $URL"
          curl -fsSL "$URL" | tar xz mcp-publisher
          chmod +x mcp-publisher
          pwd >> "$GITHUB_PATH"

      - name: Authenticate with GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          for attempt in 1 2 3; do
            echo "mcp-publisher publish attempt ${attempt}/3"
            if mcp-publisher publish packages/safe-docx/server.json; then
              echo "Published to MCP Registry successfully."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::warning::MCP Registry publish failed after 3 attempts. Manual publish may be required."
          exit 1

  ensure-release:
    name: Create or update GitHub Release
    needs: publish-suite
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Create GitHub Release with auto-generated notes
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true

  publish-mcpb-asset:
    name: Publish safe-docx MCP bundle asset
    needs: [preflight, publish-suite, ensure-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    concurrency:
      group: npm-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 11.5.1+ for OIDC trusted publishing compatibility
        run: npm install --global npm@11.5.1

      - name: Install dependencies (npm ci with retry)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Sanitize npm auth for public npx fetches
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true

      - name: Build and pack safe-docx MCP bundle
        run: npm run pack:mcpb

      - name: Generate MCP bundle checksum
        run: |
          sha256sum packages/safe-docx-mcpb/safe-docx.mcpb > packages/safe-docx-mcpb/safe-docx.mcpb.sha256

      - name: Attach safe-docx.mcpb to GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            packages/safe-docx-mcpb/safe-docx.mcpb
            packages/safe-docx-mcpb/safe-docx.mcpb.sha256
          fail_on_unmatched_files: true

  update-changelog-data:
    name: Update changelog data and open PR
    needs: publish-mcpb-asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Generate changelog data
        run: node scripts/generate_changelog_data.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- site/src/_raw/changelog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR with updated changelog data
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="chore/changelog-update-${RELEASE_TAG}"

          git config user.name "usejunior-release-bot[bot]"
          git config user.email "3004242+usejunior-release-bot[bot]@users.noreply.github.com"

          # Create or reset branch
          git checkout -B "$BRANCH"
          git add site/src/_raw/changelog.json
          git commit -m "$(cat <<'EOF'
          chore(site): update changelog data for ${{ env.RELEASE_TAG }}

          Auto-generated by the release workflow after assets were published.
          EOF
          )"
          git push --force-with-lease origin "$BRANCH"

          # Only create PR if one doesn't already exist for this branch
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --title "chore(site): update changelog data for ${RELEASE_TAG}" \
              --body "Auto-generated by the release workflow. Merging this updates the trust site changelog." \
              --head "$BRANCH" \
              --base main
          else
            echo "PR #${EXISTING} already exists for branch ${BRANCH} — skipping creation."
          fi
