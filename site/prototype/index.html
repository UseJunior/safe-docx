<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Compare Word documents | SafeDocx</title>
  <link rel="stylesheet" href="/labs/docx-compare/demo.css">
  <script type="module" src="/labs/docx-compare/demo.js"></script>
</head>
<body>
  <header class="site-header">
    <nav aria-label="Site" class="nav-inner">
      <a class="wordmark" href="https://usejunior.com/" aria-label="Junior home">Junior</a>
      <a class="product-link" href="https://usejunior.com/products/safe-docx">Back to SafeDocx</a>
    </nav>
  </header>
  <main>
    <p class="eyebrow">SafeDocx · Prototype</p>
    <h1>Compare Word documents</h1>
    <p class="intro">Choose an original and a revised Word document to create a redline. Both files stay in this browser.</p>
    <section aria-label="Compare documents">
      <div class="files">
        <label for="original">Original document
          <input id="original" type="file" accept=".docx">
        </label>
        <label for="revised">Revised document
          <input id="revised" type="file" accept=".docx">
        </label>
      </div>
      <p class="hint">Choose two .docx files, up to 10 MB each.</p>
      <button id="compare" type="button" disabled>Compare documents</button>
      <p id="status" role="status" aria-live="polite"></p>
      <a id="download" download="safe-docx-redline.docx" hidden>Download redline</a>
      <noscript><p>Enable JavaScript to compare documents in your browser.</p></noscript>
    </section>
  </main>
</body>
</html>
